name: Ukázky podkresu (hudba)
# Stejný hlas, různá hudba: zvukové ukázky pro výběr. Výsledek ve větvi previews, složka hudba/.
on:
  workflow_dispatch:
    inputs:
      dil: { description: "Díl, ze kterého se vezme text (výchozí 1)", required: false, default: "1" }
      styly: { description: "Styly oddělené čárkou", required: false, default: "lofi,funk,minimal,trap,puvodni,bez" }
permissions: { contents: write }
jobs:
  hudba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Ukázky
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Sadaltager' }}
          HLAS_REZIM: ${{ vars.HLAS_REZIM }}   # prázdné = jeden zátah (1 dotaz); vety = každá věta zvlášť (přesnější, víc dotazů)
          GEMINI_TEMPO: "1.06"
        run: node tools/video/render.js --dil "${{ inputs.dil || '1' }}" --data tools/video/dily/zkouska-svet.json --navrhy tools/video/dily/zkouska-navrhy.json --audio-only --musics "${{ inputs.styly || 'lofi,funk,minimal,trap,puvodni,bez' }}" --scale 0.3 --out out
      - name: Do větve previews
        run: |
          git config user.name "RADAR bot"; git config user.email "radar.ricansko@gmail.com"
          git checkout -q -- . ; git fetch -q origin previews && git checkout -q -f previews
          mkdir -p hudba && cp out/*.mp3 hudba/ && git add hudba && git commit -q -m "ukázky podkresu" && git push -q origin previews
