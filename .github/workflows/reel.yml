name: Denní reel a klipy
on:
  schedule:
    - cron: "20 16 * * *"   # 17:20 Praha (zimní čas) – hned po uzávěrce, večer se ladí, ráno v 9 se vydává
  workflow_dispatch:
    inputs:
      day:
        description: "Den hry (prázdné = podle dat)"
        required: false
      co:
        description: "reel | klipy | oboje"
        required: false
        default: oboje
permissions:
  contents: write
jobs:
  render:
    if: ${{ inputs.co != 'klipy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Čerstvé komentáře a stav k uzávěrce (world-dil.json)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          POSTY_OD: ${{ vars.POSTY_OD }}
          START_DATE: ${{ vars.START_DATE }}
          UZAVERKA_HODINA: ${{ vars.UZAVERKA_HODINA }}
        run: node tools/ig/komentare.js || echo "komentáře se nepodařilo načíst, renderuji z toho, co je v repu"
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'kOWmvbNszhdJeaeyEzJB' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Sadaltager' }}
          GEMINI_TEMPO: ${{ vars.GEMINI_TEMPO || '1.12' }}
        run: node tools/video/render.js --data "$([ -f world-dil.json ] && echo world-dil.json || echo world.json)" --out out ${{ inputs.day && format('--day {0}', inputs.day) || '' }}
      - name: Náhled (6 snímků) do větve previews
        run: |
          f=$(ls out/*.mp4 | head -1); n=$(basename "$f" .mp4)
          ffmpeg -v error -y -i "$f" -vf "select='not(mod(n\,100))',scale=270:-1,tile=7x1" -frames:v 1 "out/$n-nahled.jpg"
          git config user.name "RADAR bot"; git config user.email "radar.ricansko@gmail.com"
          git checkout -q --orphan previews && git rm -rfq --cached . >/dev/null && git clean -fdq -e out -e nahledy
          # do větve previews jde i samotné video (přehraje se v mobilu přes raw odkaz); větev držíme na jednom commitu, ať neroste
          mkdir -p nahledy && cp "out/$n-nahled.jpg" "out/$n.txt" "$f" nahledy/ && git add nahledy && git commit -q -m "náhled $n" && git push -q -f origin previews || echo "náhled nepushnut"
          git checkout -q main
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14
      - name: Telegram
        if: ${{ env.TG != '' }}
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          f=$(ls out/*.mp4 | head -1); t=$(ls out/*.txt | head -1)
          curl -sS -F chat_id="$CHAT" -F video=@"$f" -F supports_streaming=true -F caption="$(head -c 900 "$t")" "https://api.telegram.org/bot$TG/sendVideo" > /dev/null
  klipy:
    if: ${{ inputs.co != 'reel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Klipy + brief
        run: node tools/video/clips.js --data "$([ -f world-dil.json ] && echo world-dil.json || echo world.json)" --out out/klipy --max 7 ${{ inputs.day && format('--day {0}', inputs.day) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: klipy
          path: out/klipy
          retention-days: 14
