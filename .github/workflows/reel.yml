name: Denní reel a klipy
on:
  schedule:
    - cron: "30 4 * * *"   # 05:30 Praha (zimní čas)
  workflow_dispatch:
    inputs:
      day:
        description: "Den hry (prázdné = podle world.json)"
        required: false
      co:
        description: "reel | klipy | oboje"
        required: false
        default: oboje
permissions:
  contents: write
jobs:
  render:
    if: ${{ inputs.co != 'klipy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'kOWmvbNszhdJeaeyEzJB' }}
        run: node tools/video/render.js --out out ${{ inputs.day && format('--day {0}', inputs.day) || '' }}
      - name: Náhled (6 snímků) do větve previews
        run: |
          f=$(ls out/*.mp4 | head -1); n=$(basename "$f" .mp4)
          ffmpeg -v error -y -i "$f" -vf "select='not(mod(n\,100))',scale=270:-1,tile=7x1" -frames:v 1 "out/$n-nahled.jpg"
          git config user.name "RADAR bot"; git config user.email "radar.ricansko@gmail.com"
          git fetch origin previews:previews 2>/dev/null || git checkout --orphan previews
          git checkout previews 2>/dev/null || true
          mkdir -p nahledy && cp "out/$n-nahled.jpg" "out/$n.txt" nahledy/ && git add nahledy && git commit -q -m "náhled $n" && git push -q origin previews || echo "náhled nepushnut"
          git checkout -q main
      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14
      - name: Telegram
        if: ${{ env.TG != '' }}
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          f=$(ls out/*.mp4 | head -1); t=$(ls out/*.txt | head -1)
          curl -sS -F chat_id="$CHAT" -F video=@"$f" -F supports_streaming=true -F caption="$(head -c 900 "$t")" "https://api.telegram.org/bot$TG/sendVideo" > /dev/null
  klipy:
    if: ${{ inputs.co != 'reel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Klipy + brief
        run: node tools/video/clips.js --out out/klipy --max 7 ${{ inputs.day && format('--day {0}', inputs.day) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: klipy
          path: out/klipy
          retention-days: 14
